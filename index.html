<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クチズム 九九</title>

  <style>
    body {
      margin: 0;
      padding:0;
      background-color: #e6f7ff;
      text-align: center;
    }

    #hero {
      position: relative;
      width: 100%;
      height: 100vh;
    }
    
    #keyvisual {
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }
    
#start {
  position: absolute;
  left: 50%;
  bottom: 8%;
  transform: translateX(-50%);

  display: inline-flex;
  align-items: center;
  justify-content: center;

  padding: 16px 42px;
  background-color: #ffd84d;
  color: #333;
  text-decoration: none;

  font-family: sans-serif;
  font-size: 1.25em;
  font-weight: 700;
  letter-spacing: 0.06em;

  border-radius: 999px;
  border: 3px solid rgba(255, 255, 255, 0.9);

  box-shadow: 0 5px 12px rgba(80, 120, 150, 0.25);

  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

#start:hover {
  transform: translateX(-50%) translateY(-2px);
  box-shadow: 0 7px 16px rgba(80, 120, 150, 0.3);
}

#start:active {
  transform: translateX(-50%) translateY(2px);
  box-shadow: 0 3px 7px rgba(80, 120, 150, 0.2);
}
  </style>
</head>

<body>

  <div id="hero">

  <img
    id="keyvisual"
    src="kuchism-keyvisual.webp"
    alt="クチズム 九九">

  <a id="start" href="kuku.html">
    はじめる
  </a>

</div>

</body>
</html>
