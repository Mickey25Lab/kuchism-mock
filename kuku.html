<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クチズム 九九</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 18px 20px 24px;
      background: linear-gradient(
        180deg,
        #e6f7ff 0%,
        #f8fdff 100%
      );
      color: #334455;
      font-family: sans-serif;
      text-align: center;
    }

    .app {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    /* タイトル */

    h1 {
      margin: 4px 0 22px;
      font-size: 2.2em;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #3f86b5;
    }

    /* 質問 */

    .section-title {
      margin: 0 0 14px;
      font-size: 1.2em;
      font-weight: 700;
      color: #526b7a;
    }

    /* 人物選択 */

    .people {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .person-button {
      flex: 1;
      max-width: 220px;
      min-height: 78px;
      padding: 10px 14px;

      border: 3px solid rgba(255, 255, 255, 0.95);
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.82);
      color: #405564;

      font-family: sans-serif;
      font-size: 1em;
      font-weight: 700;
      letter-spacing: 0.03em;
      line-height: 1.4;

      box-shadow: 0 4px 12px rgba(80, 120, 150, 0.13);

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background-color 0.15s ease;
    }

    .person-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(80, 120, 150, 0.18);
    }

    .person-button:active {
      transform: translateY(1px);
      box-shadow: 0 3px 8px rgba(80, 120, 150, 0.12);
    }

    .person-button.selected {
      background-color: #ffd84d;
      color: #3f4650;
      border-color: #fff4b8;
      box-shadow: 0 5px 14px rgba(210, 175, 50, 0.25);
    }

    /* 選択した人 */

    .selected-person {
      min-height: 170px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 28px;

      margin: 0 auto 18px;
    }

    #character {
      width: 150px;
      height: 150px;
      object-fit: contain;

      border-radius: 24px;

      box-shadow: 0 7px 20px rgba(80, 120, 150, 0.15);
    }

    .selected-info {
      text-align: left;
      min-width: 170px;
    }

    #selected-name {
      margin: 0;
      font-size: 1.55em;
      font-weight: 800;
      line-height: 1.35;
      color: #4d7187;
      letter-spacing: 0.04em;
    }

    #selected-name .english {
      display: block;
    }

    #selected-name .japanese {
      display: block;
    }

    #selected-name .dan {
      display: block;
      margin-top: 4px;
      font-size: 0.85em;
      color: #7895a8;
    }

    /* 音声エリア */

    .player {
      max-width: 620px;
      margin: 0 auto;
      padding: 18px 22px;

      border-radius: 24px;

      background: rgba(255, 255, 255, 0.82);

      box-shadow: 0 7px 22px rgba(80, 120, 150, 0.12);
    }

    audio {
      display: none;
    }

    /* 再生ボタン */

    .play-button {
      width: 100%;
      max-width: 440px;
      min-height: 62px;

      padding: 15px 30px;

      border: none;
      border-radius: 999px;

      background-color: #ffd84d;
      color: #333;

      font-family: sans-serif;
      font-size: 1.15em;
      font-weight: 800;
      letter-spacing: 0.08em;

      box-shadow: 0 5px 12px rgba(210, 175, 50, 0.25);

      cursor: pointer;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
    }

    .play-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 16px rgba(210, 175, 50, 0.3);
    }

    .play-button:active {
      transform: translateY(2px);
      box-shadow: 0 3px 7px rgba(210, 175, 50, 0.2);
    }

    /* 一時停止 */

    .pause-button {
      margin-top: 8px;
      padding: 8px 20px;

      border: none;
      background: transparent;

      color: #8297a5;

      font-family: sans-serif;
      font-size: 0.85em;
      font-weight: 700;

      cursor: pointer;
    }

    .pause-button:hover {
      color: #526b7a;
    }

    /* タブレット */

    @media (max-width: 700px) {

      body {
        padding: 14px 14px 20px;
      }

      h1 {
        margin-bottom: 18px;
        font-size: 1.9em;
      }

      .section-title {
        margin-bottom: 12px;
        font-size: 1.1em;
      }

      .people {
        gap: 8px;
        margin-bottom: 14px;
      }

      .person-button {
        min-height: 72px;
        padding: 8px 6px;
        font-size: 0.95em;
      }

      .selected-person {
        min-height: 145px;
        gap: 18px;
        margin-bottom: 14px;
      }

      #character {
        width: 125px;
        height: 125px;
      }

      .selected-info {
        min-width: 145px;
      }

      #selected-name {
        font-size: 1.35em;
      }

      .player {
        padding: 16px 18px;
      }

      .play-button {
        min-height: 58px;
        font-size: 1.05em;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>クチズム 九九</h1>

    <p class="section-title">だれの九九をききたい？</p>

    <div class="people">

      <button
        class="person-button"
        id="son-button"
        onclick="selectSong('son')">
        Minato<br>
        みなと
      </button>

      <button
        class="person-button"
        id="daughter-button"
        onclick="selectSong('daughter')">
        Sumire<br>
        すみれ
      </button>

      <button
        class="person-button"
        id="pap-button"
        onclick="selectSong('pap')">
        Pap<br>
        ぱぱ
      </button>

    </div>

    <div class="selected-person">

      <img id="character" src="" alt="">

      <div class="selected-info">
        <p id="selected-name">
          <span class="english"></span>
          <span class="japanese"></span>
          <span class="dan"></span>
        </p>
      </div>

    </div>

    <div class="player">

      <audio id="song"></audio>

      <button
        class="play-button"
        onclick="document.getElementById('song').play()">
        くくをきく
      </button>

      <br>

      <button
        class="pause-button"
        onclick="document.getElementById('song').pause()">
        一時停止
      </button>

    </div>

  </div>

  <script>
    function selectSong(person) {
      const song = document.getElementById('song');
      const character = document.getElementById('character');

      const english = document.querySelector('#selected-name .english');
      const japanese = document.querySelector('#selected-name .japanese');
      const dan = document.querySelector('#selected-name .dan');

      const buttons = document.querySelectorAll('.person-button');

      buttons.forEach(button => {
        button.classList.remove('selected');
      });

      if (person === 'son') {
        song.src = '3-no-dan_son_normal_20260908.m4a';
        character.src = 'Son_2026-09-09 071711.png';

        english.textContent = 'Minato';
        japanese.textContent = 'みなと';
        dan.textContent = '三の段';

        document.getElementById('son-button')
          .classList.add('selected');
      }

      if (person === 'daughter') {
        song.src = '3-no-dan_daughter_normal_20260908.m4a';
        character.src = 'Daughter_2026-09-09 071935.png';

        english.textContent = 'Sumire';
        japanese.textContent = 'すみれ';
        dan.textContent = '三の段';

        document.getElementById('daughter-button')
          .classList.add('selected');
      }

      if (person === 'pap') {
        song.src = '3-no-dan_pap_normal_20260908.m4a';
        character.src = 'Pap_2026-09-09 071953.png';

        english.textContent = 'Pap';
        japanese.textContent = 'ぱぱ';
        dan.textContent = '三の段';

        document.getElementById('pap-button')
          .classList.add('selected');
      }
    }
  </script>

</body>
</html>
